[package]
authors = { workspace = true }
description = "picomint-core provides common code used by both client and server."
edition = { workspace = true }
license = { workspace = true }
name = "picomint-core"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[lib]
name = "picomint_core"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
backon = { workspace = true }
bitcoin = { workspace = true }
bls12_381 = { workspace = true }
derive_more = { workspace = true }
group = { workspace = true }
hex = { workspace = true, features = ["serde"] }
iroh-base = { workspace = true, default-features = false }
lightning-invoice = { workspace = true }
picomint-base32 = { workspace = true }
picomint-derive = { workspace = true }
picomint-encoding = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
schemars = { workspace = true }
secp256k1 = { workspace = true, features = ["global-context", "rand-std"] }
serde = { workspace = true }
tbs = { workspace = true }
thiserror = { workspace = true }
tpe = { workspace = true }
tss = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }

# The `Base32` derive expands to `picomint_base32` calls, which is what the
# crate depends on it for and what cargo-machete cannot see.
[package.metadata.cargo-machete]
ignored = ["picomint-base32"]
