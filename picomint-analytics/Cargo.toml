[package]
name = "picomint-analytics"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "SQLite mirror of the picomint client event log, one table per event"

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
picomint-client = { workspace = true }
picomint-core = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
