[package]
authors = { workspace = true }
description = "Standalone integration tests driving the daemons over their admin sockets"
edition = { workspace = true }
license = { workspace = true }
name = "picomint-integration-tests"
publish = false
version = { workspace = true }

[[bin]]
name = "picomint-integration-tests"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
bitcoin = { workspace = true }
bitcoincore-rpc = { workspace = true }
hex = { workspace = true }
iroh = { workspace = true, default-features = false }
iroh-mdns-address-lookup = { workspace = true }
ldk-node = { workspace = true }
lightning-invoice = { workspace = true }
lightning-types = { workspace = true }
picomint-analytics = { workspace = true }
picomint-base32 = { workspace = true }
picomint-client = { workspace = true }
picomint-client-cli-core = { workspace = true }
picomint-core = { workspace = true }
picomint-encoding = { workspace = true }
picomint-gateway-cli-core = { workspace = true }
picomint-lnurl = { workspace = true }
picomint-node-cli-core = { workspace = true }
picomint-redb = { workspace = true }
picomint-rpc = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process", "rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
