# The binary counterpart of the `:main` images: every push to main rebuilds
# picomint-rugpull and re-attaches it to the rolling `main-latest`
# pre-release, so a tester downloads one stable URL. It is built in the
# image the containers are built in, so it runs wherever they do; the
# release step runs on the runner because the slim image has neither git
# nor gh. The tag is moved by hand because a release action leaves an
# existing tag where it is.
name: Build picomint-rugpull

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: rust:slim-trixie
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2

    - run: cargo build --release --bin picomint-rugpull

    - uses: actions/upload-artifact@v4
      with:
        name: picomint-rugpull
        path: target/release/picomint-rugpull
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: picomint-rugpull

    - env:
        GH_TOKEN: ${{ github.token }}
      run: |
        chmod +x picomint-rugpull
        git tag -f main-latest
        git push -f origin refs/tags/main-latest
        gh release view main-latest >/dev/null 2>&1 \
          || gh release create main-latest --prerelease --title main --notes ""
        gh release edit main-latest --notes "picomint-rugpull built from ${GITHUB_SHA} on rust:slim-trixie, the image the containers are built in: x86_64 Linux with glibc 2.41 or newer, Debian 13 or Ubuntu 25.04 and up."
        gh release upload main-latest picomint-rugpull --clobber
