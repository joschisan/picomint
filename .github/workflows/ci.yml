name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    name: Cargo Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    name: Cargo Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: picomint
    - run: cargo clippy --all-targets --all-features -- -D warnings

  sort:
    name: Cargo Sort
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-sort
    - run: cargo sort --check

  machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-machete
    - run: cargo machete

  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: picomint
    - run: cargo test --workspace

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: picomint

    - name: Prebuild workspace
      run: cargo build --workspace --release

    - name: Make test script executable
      run: chmod +x test-integration.sh

    - name: Run integration tests
      run: timeout 300 ./test-integration.sh

  bootstrap:
    name: Bootstrap Installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Run bootstrap.sh via stdin (mirrors curl|bash on a real machine)
      env:
        AUTO_YES: "1"
      run: cat bootstrap.sh | bash

    - name: Verify Web UI is reachable
      run: curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000 > /dev/null

  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: app-bridge
        workspaces: app/rust

    # Pinned to the version the bridge's generated code is written against.
    # Cached because building it from source takes minutes.
    - id: frb-cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/flutter_rust_bridge_codegen
        key: frb-codegen-2.10.0-${{ runner.os }}

    - if: steps.frb-cache.outputs.cache-hit != 'true'
      run: cargo install --locked flutter_rust_bridge_codegen@2.10.0

    - uses: subosito/flutter-action@v2
      with:
        cache: true

    - run: flutter pub get
      working-directory: app

    # Neither generated tree is committed, so this is what makes the bridge
    # compile and the Dart bindings exist at all.
    - name: Generate bridge bindings
      run: flutter_rust_bridge_codegen generate
      working-directory: app

    - name: Clippy bridge
      run: cargo clippy --all-targets -- -D warnings
      working-directory: app/rust

    - run: flutter analyze
      working-directory: app
