name: Build Docker Images

on:
  push:
    branches: [ main ]
  # One-off publish of a single image as :main from any branch — for
  # bootstrapping a newly renamed image that main has not published yet,
  # without overwriting the other images' :main tags.
  workflow_dispatch:
    inputs:
      image:
        description: "Image to publish as :main"
        required: true
        type: choice
        options:
          - picomint-node-daemon
          - picomint-gateway-daemon
          - picomint-lnurl-daemon

jobs:
  build-and-push:
    if: github.event_name == 'push' || matrix.image == inputs.image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: picomint-node-daemon
            dockerfile: docker-node/Dockerfile
          - image: picomint-gateway-daemon
            dockerfile: docker-gateway/Dockerfile
          - image: picomint-lnurl-daemon
            dockerfile: docker-lnurl/Dockerfile

    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=sha
          type=raw,value=main,enable=${{ github.event_name == 'workflow_dispatch' }}

    - uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
